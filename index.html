<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Галерея фотографий</title>
</head>

<body>

  <section class="gallery">
    <div class="container">
      <div class="gallery__header">
        <h2 class="gallery__title">Галерея</h2>
        <button type="button" class="gallery__btn">Загрузить</button>
      </div>
      <ul class="gallery__wrapper">
        <li class="gallery__card">
          <img src="img/gornoe_ozero.png" alt="Горное озеро" class="gallery__card-pic">
          <h3 class="gallery__card-title">Горное озеро</h3>
          <time datetime="2026-06-12" class="gallery__card-date">12 Июня 2026</time>
        </li>
        <li class="gallery__card">
          <img src="img/nochnoj_gorod.png" alt="Ночной город" class="gallery__card-pic">
          <h3 class="gallery__card-title">Ночной город</h3>
          <time datetime="2026-06-10" class="gallery__card-date">10 Июня 2026</time>
        </li>
        <li class="gallery__card">
          <img src="img/okeanskij_plyazh.png" alt="Океанский пляж" class="gallery__card-pic">
          <h3 class="gallery__card-title">Океанский пляж</h3>
          <time datetime="2026-06-08" class="gallery__card-date">8 Июня 2026</time>
        </li>
        <li class="gallery__card">
          <img src="img/lesnaya_tropa.png" alt="Лесная тропа" class="gallery__card-pic">
          <h3 class="gallery__card-title">Лесная тропа</h3>
          <time datetime="2026-06-06" class="gallery__card-date">6 Июня 2026</time>
        </li>
        <li class="gallery__card">
          <img src="img/vodopad.png" alt="Водопад" class="gallery__card-pic">
          <h3 class="gallery__card-title">Водопад</h3>
          <time datetime="2026-06-04" class="gallery__card-date">4 Июня 2026</time>
        </li>
        <li class="gallery__card">
          <img src="img/gorodskie_ulicy.png" alt="Городские улицы" class="gallery__card-pic">
          <h3 class="gallery__card-title">Городские улицы</h3>
          <time datetime="2026-06-02" class="gallery__card-date">2 Июня 2026</time>
        </li>
      </ul>
    </div>
  </section>

</body>

</html>
