<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Галерея фотографий</title>
</head>

<body>

  <section class="gallery">
    <div class="container">
      <div class="gallery__top">
        <h2 class="gallery__title">Галерея</h2>
        <button type="button" class="gallery__btn">Загрузить</button>
      </div>
      <ul class="gallery__list grid">
        <li class="gallery__item">
          <div class="gallery-card">
            <img src="img/gornoe_ozero.png" alt="Горное озеро" class="gallery-card__pic">
            <div class="gallery-card__text">
              <h3 class="gallery-card__title">Горное озеро</h3>
              <time datetime="2026-06-12 00:00" class="gallery-card__time">12 Июня 2026</time>
            </div>
          </div>
        </li>
        <li class="gallery__item">
          <div class="gallery-card">
            <img src="img/nochnoj_gorod.png" alt="Ночной город" class="gallery-card__pic">
            <div class="gallery-card__text">
              <h3 class="gallery-card__title">Ночной город</h3>
              <time datetime="2026-06-10 00:00" class="gallery-card__time">10 Июня 2026</time>
            </div>
          </div>
        </li>
        <li class="gallery__item">
          <div class="gallery-card">
            <img src="img/okeanskij_plyazh.png" alt="Океанский пляж" class="gallery-card__pic">
            <div class="gallery-card__text">
              <h3 class="gallery-card__title">Океанский пляж</h3>
              <time datetime="2026-06-08 00:00" class="gallery-card__time">8 Июня 2026</time>
            </div>
          </div>
        </li>
        <li class="gallery__item">
          <div class="gallery-card">
            <img src="img/lesnaya_tropa.png" alt="Лесная тропа" class="gallery-card__pic">
            <div class="gallery-card__text">
              <h3 class="gallery-card__title">Лесная тропа</h3>
              <time datetime="2026-06-06 00:00" class="gallery-card__time">6 Июня 2026</time>
            </div>
          </div>
        </li>
        <li class="gallery__item">
          <div class="gallery-card">
            <img src="img/vodopad.png" alt="Водопад" class="gallery-card__pic">
            <div class="gallery-card__text">
              <h3 class="gallery-card__title">Водопад</h3>
              <time datetime="2026-06-04 00:00" class="gallery-card__time">4 Июня 2026</time>
            </div>
          </div>
        </li>
        <li class="gallery__item">
          <div class="gallery-card">
            <img src="img/gorodskie_ulicy.png" alt="Городские улицы" class="gallery-card__pic">
            <div class="gallery-card__text">
              <h3 class="gallery-card__title">Городские улицы</h3>
              <time datetime="2026-06-02 00:00" class="gallery-card__time">2 Июня 2026</time>
            </div>
          </div>
        </li>
      </ul>
    </div>
  </section>

</body>

</html>
